name: materialize-ikoagent-pngs
on:
  workflow_dispatch:
  push:
    branches: [feat/ikoagent-pngs-card-click]
    paths:
      - 'public/projects/ikoagent/*.png.b64'
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ikoagent-pngs-card-click
          fetch-depth: 0
      - name: Decode PNGs, drop SVG wrappers, commit
        run: |
          set -euo pipefail
          DEST=public/projects/ikoagent
          for f in answer-and-trace desktop-answer desktop-desk phone-desk; do
            test -f "$DEST/${f}.png.b64"
            base64 -d < "$DEST/${f}.png.b64" > "$DEST/${f}.png"
            python3 -c "d=open('$DEST/${f}.png','rb').read(8); assert d.startswith(b'\x89PNG'), d"
            rm -f "$DEST/${f}.png.b64" "$DEST/${f}.svg"
            ls -la "$DEST/${f}.png"
          done
          # cover matches answer-and-trace (same as previous SVG twin)
          cp "$DEST/answer-and-trace.png" "$DEST/cover.png"
          rm -f "$DEST/cover.svg" "$DEST/cover.png.b64"
          # remove this one-shot workflow after materialize
          rm -f .github/workflows/materialize-ikoagent-pngs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$DEST" .github/workflows || true
          git status
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "assets: materialize IkoAgent PNG screenshots; remove SVG wrappers"
          git push origin HEAD:feat/ikoagent-pngs-card-click
