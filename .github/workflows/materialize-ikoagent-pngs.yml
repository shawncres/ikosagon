name: materialize-ikoagent-pngs
on:
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ikoagent-project-page
          fetch-depth: 0
      - name: Decode PNGs if b64 present
        run: |
          set -euo pipefail
          DEST=public/projects/ikoagent
          shopt -s nullglob
          parts=("$DEST"/*.png.b64 "$DEST"/*.png.b64.part*)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "No b64 payloads; nothing to materialize"
            exit 0
          fi
          for f in answer-and-trace cover desktop-answer desktop-desk phone-desk; do
            if [ -f "$DEST/${f}.png.b64" ]; then
              base64 -d < "$DEST/${f}.png.b64" > "$DEST/${f}.png"
            elif ls "$DEST/${f}.png.b64.part"* >/dev/null 2>&1; then
              cat "$DEST/${f}.png.b64.part"* > /tmp/${f}.b64
              base64 -d < /tmp/${f}.b64 > "$DEST/${f}.png"
              rm -f "$DEST/${f}.png.b64.part"*
            else
              echo "missing $f"; exit 1
            fi
            python3 -c "d=open('$DEST/${f}.png','rb').read(8); assert d.startswith(b'\x89PNG'), d"
            rm -f "$DEST/${f}.png.b64" "$DEST/${f}.svg"
          done
          rm -f "$DEST/PROBE.txt"
          python3 -c "from pathlib import Path; p=Path('content/projects/ikoagent.mdx'); p.write_text(p.read_text().replace('.svg','.png'))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo 'no changes' && exit 0
          git commit -m "chore(ikoagent): materialize real PNG screenshots; drop SVG wrappers"
          git push origin HEAD:feat/ikoagent-project-page
