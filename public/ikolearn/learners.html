<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f3ead8">
  <meta name="color-scheme" content="light dark">
  <!-- light or dark before the first paint (no flash): the learner's choice on this device, else the device's (theme.js) -->
  <script>(function(){var m;try{m=localStorage.getItem("ikolearn-theme")}catch(e){}if(m!=="dark"&&m!=="light")m=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.setAttribute("data-theme",m);var t=document.querySelector('meta[name="theme-color"]');if(t)t.setAttribute("content",m==="dark"?"#1e1712":"#f3ead8")})()</script>
  <title>IkoLearn learners</title>
  <link rel="icon" href="/ikolearn/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ikolearn/styles.css">
  <link rel="stylesheet" href="/ikolearn/family.css">
</head>
<body>
  <main class="col fam">
    <p class="fam-back"><a href="/ikolearn/">Back to IkoLearn</a></p>
    <div id="lrn" aria-live="polite"></div>
    <p class="fine fam-foot" data-theme-slot>Learners are kept on this device by first name only. No accounts. <a href="/ikolearn/privacy">Privacy</a></p>
  </main>
  <script src="/ikolearn/theme.js"></script>
  <script src="/ikolearn/profiles.js"></script>
  <script src="/ikolearn/learners.js"></script>
</body>
</html>
